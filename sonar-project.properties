sonar.projectKey=parallix
sonar.projectName=Parallix
sonar.host.url=https://sonarcloud.io
sonar.organization=oxtan-maker
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/graphify-out/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
# New-code baseline is the primary branch, not a version tag. Every mission
# shares projectKey=parallix, so a previous-version tag drifts across missions
# and counts pre-existing violations (present on main) as "new". Against main,
# new_violations only reflects the current mission's own changes.
sonar.newCode.referenceBranch=main
# Disable the project version so the new-code definition stays "Branch (vs
# main)" instead of "Previous version". The SonarScanner for npm injects the
# package.json version by default, which switches new-code to "Previous
# version"; that baseline lives on a different mission's branch, git blame can
# not reach it here, and SonarQube then fails to attribute new lines. No version
# = branch-based new code = this mission's own changes vs main.
sonar.projectVersion=
