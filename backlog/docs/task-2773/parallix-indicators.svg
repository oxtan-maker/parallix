<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Checkpoints measure progress, review rounds spend a budget" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#141413">Checkpoints measure progress; review rounds spend a budget</text>
  <text x="24" y="48" font-size="11.5" fill="#5a5a57">The two run in opposite directions, so they should not share a shape</text>

  <line x1="392" y1="64" x2="392" y2="256" stroke="#e5e5e2"/>

  <text x="24" y="80" font-size="13" font-weight="600" fill="#141413">Today</text>
  <text x="416" y="80" font-size="13" font-weight="600" fill="#141413">Proposed</text>

  <text x="24" y="112" font-size="11.5" fill="#5a5a57">Checkpoints · how far the mission has come</text>

  <g id="checkpoints-today" fill="#1a9c3e">
    <rect x="24" y="124" width="14" height="8" rx="2"/>
    <rect x="42" y="124" width="14" height="8" rx="2"/>
    <rect x="60" y="124" width="14" height="8" rx="2"/>
    <rect x="78" y="124" width="14" height="8" rx="2"/>
    <rect x="96" y="124" width="14" height="8" rx="2"/>
    <rect x="114" y="124" width="14" height="8" rx="2"/>
    <rect x="132" y="124" width="14" height="8" rx="2"/>
    <rect x="150" y="124" width="14" height="8" rx="2"/>
    <rect x="168" y="124" width="14" height="8" rx="2"/>
    <rect x="186" y="124" width="14" height="8" rx="2"/>
    <rect x="204" y="124" width="14" height="8" rx="2"/>
    <rect x="222" y="124" width="14" height="8" rx="2"/>
    <rect x="240" y="124" width="14" height="8" rx="2"/>
    <rect x="258" y="124" width="14" height="8" rx="2"/>
    <rect x="276" y="124" width="14" height="8" rx="2"/>
    <rect x="294" y="124" width="14" height="8" rx="2"/>
    <rect x="312" y="124" width="14" height="8" rx="2"/>
  </g>
  <text x="24" y="152" font-size="11.5" fill="#5a5a57">No denominator: CP-3 and CP-17 cannot be compared</text>

  <g id="checkpoints-proposed">
    <rect x="416" y="122" width="220" height="12" rx="6" fill="#e5e5e2"/>
    <rect x="416" y="122" width="128" height="12" rx="6" fill="#2563c9"/>
  </g>
  <text x="648" y="132" font-size="13" font-weight="600" fill="#141413">CP-7 / 12</text>
  <text x="416" y="152" font-size="11.5" fill="#5a5a57">Fixed width; denominator already on the wire</text>

  <text x="24" y="190" font-size="11.5" fill="#5a5a57">Review rounds · a budget of five attempts, spent</text>

  <g id="review-today">
    <rect x="24" y="202" width="16" height="8" rx="2" fill="#1a9c3e"/>
    <rect x="44" y="202" width="16" height="8" rx="2" fill="#1a9c3e"/>
    <rect x="64" y="202" width="16" height="8" rx="2" fill="#e5e5e2"/>
    <rect x="84" y="202" width="16" height="8" rx="2" fill="#e5e5e2"/>
    <rect x="104" y="202" width="16" height="8" rx="2" fill="#e5e5e2"/>
  </g>
  <text x="24" y="230" font-size="11.5" fill="#5a5a57">The same bar shape, a different meaning</text>

  <g id="review-proposed">
    <circle cx="426" cy="208" r="7" fill="#1a9c3e" fill-opacity="0.18" stroke="#1a9c3e" stroke-width="2"/>
    <circle cx="454" cy="208" r="7" fill="none" stroke="#2563c9" stroke-width="2"/>
    <circle cx="482" cy="208" r="7" fill="none" stroke="#b8b8b4" stroke-width="1.25"/>
    <circle cx="510" cy="208" r="7" fill="none" stroke="#b8b8b4" stroke-width="1.25"/>
    <circle cx="538" cy="208" r="7" fill="none" stroke="#b8b8b4" stroke-width="1.25"/>
  </g>
  <text x="426" y="212" text-anchor="middle" font-size="10.5" fill="#141413">✓</text>
  <text x="566" y="212" font-size="13" fill="#141413">round 2 of 5 · 3 left</text>
  <text x="416" y="238" font-size="11.5" fill="#5a5a57">Circles count down; a glyph marks the disposition</text>

  <text x="24" y="276" font-size="11.5" fill="#5a5a57">The fans already signal liveness, so neither indicator needs to blink.</text>
</svg>
