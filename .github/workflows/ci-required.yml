# Mission 5 (task-2500.05): required GitHub Actions verification pipeline.
#
# Runs Mission 4's GitHub-safe, clean-runner tier (`npm run test:ci`) as the
# stable `ci-required` check for pull requests targeting the protected primary
# branch.
#
# The `ci-required` job name is a literal so branch protection can require it
# stably; it is never computed from branch, event, or matrix data.
#
# The `push` trigger is the ADR 0058 github-publish verification ref:
# `refs/heads/github-publish/<sha>` carries the exact locally generated
# integration commit. TASK-2549 (ADR 0061) verifies it differentially:
# publication candidates compare the full current `origin/main` SHA against the
# exact `github.sha` candidate in the dependency review step, while normal pull
# requests use GitHub's native PR comparison.
#
# All Actions in this workflow are pinned to immutable release SHAs with a
# release-version comment (TASK-2549); Dependabot (github-actions ecosystem)
# proposes updates to the pins.
name: ci-required

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'github-publish/**'

# Cancel only superseded runs for a single pull request. PR runs group by pull
# request number (superseded by the next PR update via cancel-in-progress);
# publication runs group by run_id, so a later publication does not cancel an
# earlier one merely because a new commit is pushed (SC5). A person can still
# cancel any run manually — this only governs automatic cancellation.
concurrency:
  group: ci-required-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  ci-required:
    # PR and candidate runs always verify. Main reuses an earlier exact proof
    # or verifies the new merge/squash/rebase SHA before release.
    needs: publication-proof
    if: >-
      always() && !cancelled() && github.event.deleted != true &&
      (github.ref != 'refs/heads/main' ||
       (needs.publication-proof.result == 'success' && needs.publication-proof.outputs.verified == 'false'))
    name: ci-required
    runs-on: ubuntu-latest
    steps:
      # checkout defaults to the triggered commit: the PR merge commit for
      # pull_request events and the pushed SHA for push events.
      - name: Check out the triggered commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: tests compare mission branches against the primary
          # branch, which needs the merge base.
          fetch-depth: 0

      # Parallix expects its standard repository layout: a local primary branch
      # checked out in a primary worktree, with other work in sibling worktrees
      # (getPrimaryBranch / resolveMainRepo), and the tests that exercise its git
      # workflow run against that layout. A pull_request checkout is a detached
      # merge commit with main only as origin/main, so add main as a worktree.
      # Push runs already have main checked out.
      - name: Provide the primary worktree
        run: git show-ref --verify --quiet refs/heads/main || git worktree add --quiet -b main "$RUNNER_TEMP/parallix-main" origin/main

      # Differential dependency review (TASK-2549, ADR 0061): fail this step
      # when the candidate newly introduces a dependency with a High or
      # Critical GHSA. Runs early — after repo/ref state is available and
      # before the expensive Node/test/Sonar work — so a vulnerable dependency
      # fails fast. Existing dependency debt on the base is reported but never
      # blocking; only added vulnerable dependencies fail the run.
      #
      # Comparison refs:
      #   - pull_request: both refs empty -> the action's native PR comparison
      #     (PR base SHA -> merge-commit head SHA).
      #   - push (github-publish/<sha>): base = full current origin/main SHA
      #     resolved below after the fetch-depth-0 checkout; head = the exact
      #     github.sha candidate. Missing/unresolvable refs or a review error
      #     fail the step (fail-closed, never "no changes").
      #
      # Policy: fail-on-severity high (High/Critical block, moderate/low are
      # reported only); fail-on-scopes explicitly covers unknown,runtime,
      # development (the action's default scope is narrower: runtime only);
      # license-check is disabled so license policy cannot become a blocking
      # criterion (license governance is out of scope for this gate).
      # retry-on-snapshot-warnings absorbs GitHub dependency-graph ingestion
      # lag for a just-pushed publication SHA before the comparison is taken.
      - name: Resolve the trusted publication base (full origin/main SHA)
        id: trusted-base
        if: github.event_name == 'push'
        run: |
          base_sha=$(git rev-parse origin/main)
          # Fail closed unless origin/main resolved to an exact 40-char SHA.
          [ "${#base_sha}" -eq 40 ] || { echo "origin/main did not resolve to a full SHA: $base_sha" >&2; exit 1; }
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Differential dependency review (blocks newly introduced High/Critical)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: unknown,runtime,development
          license-check: false
          vulnerability-check: true
          base-ref: ${{ github.event_name == 'push' && steps.trusted-base.outputs.sha || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

      # node-version: '26' + check-latest: true installs the latest 26.x.
      # TASK-2591 (ADR 0062): coverage uses Node's native include-all contract
      # (--test-coverage-include-all), which needs Node >= 26.7; the unit suite
      # itself needs >= 24.15.0 because test/lib/module-mock.ts uses
      # mock.module's exports option. cache: npm is the built-in setup-node npm
      # cache (no external cache action, so this stays within the checkout +
      # Node setup only allowance in Restricted Areas); the npm cache is keyed
      # on package-lock.json by setup-node.
      # NOTE: package.json engines.node stays >=22.23.1 (its floor is the runtime
      # floor for shipped code, not the test floor).
      - name: Set up Node (>= 26.7 for native coverage)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '26'
          check-latest: true
          cache: npm

      - name: Install dependencies (lockfile-respecting, deterministic)
        run: npm ci
        env:
          CI: 'true'

      # Keep the hosted proof aligned with the repository's local static gate:
      # type-aware ESLint, its committed debt ratchet, typechecking, and test
      # hygiene run through the one project-owned entry point.
      - name: Run static analysis gate
        run: ./scripts/verify-local.sh static-analysis
        env:
          CI: 'true'

      - name: Run GitHub-safe verification (npm run test:ci)
        run: npm run test:ci
        env:
          CI: 'true'
          # bubblewrap is not in the GitHub-hosted runner image. Without this
          # explicit opt-out the task-2513 confinement gate blocks every
          # mutating launch (even mocked ones). Confinement tests pin the probe.
          PARALLIX_NO_BUBBLEWRAP: '1'
          # TASK-2547: coverage is a reporting mode of this CI-safe execution, not
          # a second pass. Unit and integration-ci each run once with Node's built
          # in coverage, emitting one lcov per tier that `npm run coverage:merge`
          # unions. The per-test --test-timeout safety net stays; the local budget
          # reporter is dropped on hosted runners (TASK-2542).
          PARALLIX_TEST_COVERAGE: '1'

      # Coverage for the scan comes from the CI-safe execution above (each CI-safe
      # test runs once with Node built in coverage); this step only sources the
      # token. `npm run coverage:merge` unions the per-tier LCOV fragments into
      # coverage/lcov.info, and the SonarQube quality gate owns the required 90%
      # coverage condition for new code (no legacy whole-tree threshold, SC7).
      #
      # Runs on trusted code only: push events and same-repo pull requests.
      # GitHub Actions rejects the secrets context in a step-level if: conditional,
      # so the guard branches on the event/repodata context rather than on the
      # secret. Untrusted fork pull requests — which never receive repository
      # secrets — are skipped and not blocked, and no secret is reachable from
      # untrusted code. On trusted runs a missing token fails the job clearly
      # (F2), so SonarQube stays mandatory where it can run.
      - name: Ensure SONAR_TOKEN configured (trusted runs only)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo '::error::SONAR_TOKEN environment secret is not configured'
            exit 1
          fi
      # Identity per ADR 0060: `npm run sonar` is the single SonarQube Cloud
      # entrypoint shared with local mission verification (organization
      # oxtan-maker, project parallix). On GitHub the entrypoint does not send a
      # branch: the scanner's CI integration derives branch/pull-request identity
      # from the event, so a pull_request run is analysed as its pull request
      # rather than as the detached merge commit. Only SONAR_TOKEN is required —
      # the Cloud host lives in sonar-project.properties, not in a secret. The
      # mandatory provider new-code quality gate is unchanged: progressive
      # HIGH/BLOCKER severity policy plus provider-owned coverage, duplication,
      # and security-hotspot conditions (ADR 0060).
      # TASK-2547: union the per-tier LCOV fragments (coverage/.lcov-unit.info,
      # coverage/.lcov-integration-ci.info) written by the coverage-aware CI-safe
      # execution into one Sonar-consumable coverage/lcov.info. No second test
      # pass runs here.
      - name: Merge CI-safe coverage into one LCOV report
        run: npm run coverage:merge
      - name: Publish whole-report CI-safe LCOV coverage
        run: npm run coverage:summary -- "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      # TASK-2636: SonarQube Cloud Scanner 3.1+ rejects Java below 21, so the
      # previous Java 17 runtime failed the trusted CI quality gate. Provision a
      # pinned Java 21 runtime with the immutable setup-java SHA before the
      # mandatory quality gate can invoke `npm run sonar`. Same immutable-SHA +
      # release-version contract as every other action here (TASK-2549).
      - name: Set up Java 21 (SonarQube Cloud scanner floor)
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b  # v4.6.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Run mandatory SonarQube quality gate
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        # pipefail is set inline because the step's default bash -e does not
        # set it: without it, tee would mask a non-zero scanner exit and the
        # step could pass a failed analysis. The tee keeps the full output in
        # sonar-quality-gate.log for the job summary step below while the
        # live output streams to the Actions log for diagnosis (TASK-2566).
        run: |
          set -o pipefail
          npm run sonar 2>&1 | tee "$GITHUB_WORKSPACE/sonar-quality-gate.log"
        env:
          CI: 'true'
          PARALLIX_NO_BUBBLEWRAP: '1'
          # Secrets arrive only through the GitHub secrets context, never a
          # literal value. Scoped to the scan step (least privilege): the broad
          # test:ci and npm ci steps do not inherit SONAR_TOKEN. It is never
          # committed, emitted to logs, nor made available to untrusted
          # pull-request code.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Publish SonarQube quality gate result
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/sonar-quality-gate.log" ]; then
            {
              printf '## SonarQube quality gate\n\n```\n'
              tail -n 60 "$GITHUB_WORKSPACE/sonar-quality-gate.log"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## SonarQube quality gate' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '_Skipped: untrusted fork pull request (no repository secrets available)._' >> "$GITHUB_STEP_SUMMARY"
          fi

  publication-proof:
    # Durable Actions history, not the short-lived github-publish ref, is the
    # release authorization. This job deliberately performs no source review,
    # test, coverage, or SonarQube work.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: publication-proof
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the triggering main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}

      # Node 24 strips the verifier's erasable TypeScript annotations, so this
      # read-only authorization check has no npm install or test payload.
      - name: Set up Node 24 for publication-proof verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          check-latest: true

      - name: Look up earlier exact github-publish proof
        id: proof
        run: node scripts/verify-github-publication-proof.ts
        env:
          # This ephemeral token inherits only this job's actions: read and
          # contents: read permissions. It is not an npm or release credential.
          GH_TOKEN: ${{ github.token }}

  release:
    needs: [publication-proof, ci-required]
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publication-proof.result == 'success' &&
      ((needs.publication-proof.outputs.verified == 'true' && needs.ci-required.result == 'skipped') ||
       (needs.publication-proof.outputs.verified == 'false' && needs.ci-required.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the verified triggering SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 24 for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Install the verified source deterministically
        run: npm ci

      - name: Validate and publish the verified source
        run: npm run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
