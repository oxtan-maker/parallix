# Mission 5 (task-2500.05): required GitHub Actions verification pipeline.
#
# Runs Mission 4's GitHub-safe, clean-runner tier (`npm run test:ci`) as the
# stable `ci-required` check for pull requests targeting the protected primary
# branch.
#
# The `ci-required` job name is a literal so branch protection can require it
# stably; it is never computed from branch, event, or matrix data.
#
# Publication trigger is provisional, not a claimed github-publish ref: ADR 0045
# marks github-publish unimplemented, so GitHub verifies the exact resulting
# commit before it reaches the protected primary branch. The concrete verification
# ref is deferred to the follow-up mission that verifies this pipeline live; the
# `push` trigger below is a real trigger only and must not be cited as the
# github-publish verification ref until that ref is established.
name: ci-required

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'github-publish/**'

# Cancel only superseded runs for a single pull request. PR runs group by pull
# request number (superseded by the next PR update via cancel-in-progress);
# publication runs group by run_id, so a later publication does not cancel an
# earlier one merely because a new commit is pushed (SC5). A person can still
# cancel any run manually — this only governs automatic cancellation.
concurrency:
  group: ci-required-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-required:
    if: github.event.deleted != true
    name: ci-required
    runs-on: ubuntu-latest
    steps:
      # checkout defaults to the triggered commit: the PR merge commit for
      # pull_request events and the pushed SHA for push events.
      - name: Check out the triggered commit
        uses: actions/checkout@v7
        with:
          # Full history: tests compare mission branches against the primary
          # branch, which needs the merge base.
          fetch-depth: 0

      # Parallix expects its standard repository layout: a local primary branch
      # checked out in a primary worktree, with other work in sibling worktrees
      # (getPrimaryBranch / resolveMainRepo), and the tests that exercise its git
      # workflow run against that layout. A pull_request checkout is a detached
      # merge commit with main only as origin/main, so add main as a worktree.
      # Push runs already have main checked out.
      - name: Provide the primary worktree
        run: git show-ref --verify --quiet refs/heads/main || git worktree add --quiet -b main "$RUNNER_TEMP/parallix-main" origin/main

      # node-version: '24' + check-latest: true installs the latest 24.x (24.21.0
      # today), which is >= 24.15.0 — the floor the unit suite actually needs,
      # because test/lib/module-mock.ts uses mock.module's exports option that
      # Node < 24.15.0 ignores (46 unit tests fail on 22.x). cache: npm is the
      # built-in setup-node npm cache (no external cache action, so this stays
      # within the checkout + Node setup only allowance in Restricted Areas);
      # the npm cache is keyed on package-lock.json by setup-node.
      # NOTE: package.json engines.node stays >=22.23.1 (its floor is the runtime
      # floor for shipped code, not the test floor); raising it is outside this
      # mission's Restricted Areas (package.json).
      - name: Set up Node (>= 24.15.0)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm

      - name: Install dependencies (lockfile-respecting, deterministic)
        run: npm ci
        env:
          CI: 'true'

      - name: Run GitHub-safe verification (npm run test:ci)
        run: npm run test:ci
        env:
          CI: 'true'
          # bubblewrap is not in the GitHub-hosted runner image. Without this
          # explicit opt-out the task-2513 confinement gate blocks every
          # mutating launch (even mocked ones). Confinement tests pin the probe.
          PARALLIX_NO_BUBBLEWRAP: '1'

      # Shared coverage-plus-SonarQube command (the same command wired into
      # workflow.config.json adapters.gates.preIntegration): it produces LCOV
      # for the scanner without applying the legacy whole-tree threshold. The
      # SonarQube quality gate owns the required 90% coverage of new code.
      #
      # Runs on trusted code only: push events and same-repo pull requests.
      # GitHub Actions rejects the secrets context in a step-level if: conditional,
      # so the guard branches on the event/repodata context rather than on the
      # secret. Untrusted fork pull requests — which never receive repository
      # secrets — are skipped and not blocked, and no secret is reachable from
      # untrusted code. On trusted runs a missing token fails the job clearly
      # (F2), so SonarQube stays mandatory where it can run.
      - name: Ensure SONAR_TOKEN configured (trusted runs only)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo '::error::SONAR_TOKEN environment secret is not configured'
            exit 1
          fi
      - name: Run coverage plus mandatory SonarQube quality gate
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm run test:coverage -- --threshold 0 --lcov && npm run sonar > "$GITHUB_WORKSPACE/sonar-quality-gate.log" 2>&1
        env:
          CI: 'true'
          PARALLIX_NO_BUBBLEWRAP: '1'
          # Secrets arrive only through the GitHub secrets context, never a
          # literal value. Scoped to the scan step (least privilege): the broad
          # test:ci and npm ci steps do not inherit SONAR_TOKEN, so the local
          # file-token test (task-2527) still sees the file token when it runs in
          # a CI run that also has SONAR_TOKEN exported. Neither is committed,
          # emitted to logs, nor made available to untrusted pull-request code.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Publish SonarQube quality gate result
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/sonar-quality-gate.log" ]; then
            {
              printf '## SonarQube quality gate\n\n```\n'
              tail -n 60 "$GITHUB_WORKSPACE/sonar-quality-gate.log"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## SonarQube quality gate' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '_Skipped: untrusted fork pull request (no repository secrets available)._' >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: ci-required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-required.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the verified triggering SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node 24 for npm Trusted Publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Install the verified source deterministically
        run: npm ci

      - name: Validate and publish the verified source
        run: npm run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
