  cleanup-verification-ref:
    name: cleanup-verification-ref

    # Only after a successfully published main push.
    needs: ci-required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete published verification ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFY_REF: heads/github-publish/${{ github.sha }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/$VERIFY_REF" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/$VERIFY_REF"
            echo "Deleted refs/$VERIFY_REF"
          else
            echo "No verification ref exists for $GITHUB_SHA"
          fi