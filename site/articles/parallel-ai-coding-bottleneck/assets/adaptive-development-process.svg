<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">The same checks can overlap</title>
<desc id="desc">A coding agent implements and tests. Independent agent review, human review and integration checks can overlap on the same revision. As results come in, the process may start or stop a check, wait, or repair. Starting a repair cancels checks in progress. The team can merge once all three have passed the current revision.</desc>
<defs><marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#535e57" /></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d3925" /></marker></defs>
<style>text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #252b2a; } .heading { font-weight:650; } .role { fill:#535e57; } .flow { fill:none; stroke:#535e57; stroke-width:1.8; marker-end:url(#forward); } .rework { fill:none; stroke:#8d3925; stroke-width:1.8; } .rework-end { marker-end:url(#return); }</style>
<text x="12" y="24" font-size="20" class="heading">The same checks can overlap</text>
<path d="M12 46V40H640V46" fill="none" stroke="#24604f" stroke-width="1.4" /><text x="640" y="34" font-size="13" text-anchor="end" style="fill:#24604f">Measured time</text>
<rect x="160" y="48" width="480" height="218" rx="10" fill="#faf8f3" stroke="#24604f" stroke-width="1.5" />
<text x="176" y="74" font-size="18" class="heading">Three checks on one revision</text>
<text x="176" y="98" font-size="15" class="role">Start or stop checks as results come in</text>
<rect x="12" y="112" width="136" height="126" rx="8" fill="#eef1e9" stroke="#24604f" /><g transform="translate(24 122)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="28" height="22" rx="5" /><path d="M16 8V2M0 16H2M30 16H33M10 24H22" /><circle cx="10" cy="16" r="1.4" fill="#252b2a" /><circle cx="22" cy="16" r="1.4" fill="#252b2a" /></g><text x="24" y="177" font-size="16" class="heading">Implement</text><text x="24" y="198" font-size="16" class="heading">and test</text><text x="24" y="223" font-size="14" class="role">Coding agent</text>
<rect x="172" y="112" width="136" height="126" rx="8" fill="#eef1e9" stroke="#24604f" /><g transform="translate(184 122)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="28" height="22" rx="5" /><path d="M16 8V2M0 16H2M30 16H33M10 24H22" /><circle cx="10" cy="16" r="1.4" fill="#252b2a" /><circle cx="22" cy="16" r="1.4" fill="#252b2a" /></g><text x="184" y="177" font-size="16" class="heading">Review</text><text x="184" y="198" font-size="16" class="heading">(and test)</text><text x="184" y="223" font-size="14" class="role">Another agent</text>
<rect x="332" y="112" width="136" height="126" rx="8" fill="#f4e9de" stroke="#c7ccc3" /><g transform="translate(344 122)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="9" r="7" /><path d="M2 33v-4c0-13 28-13 28 0v4" /></g><text x="344" y="177" font-size="16" class="heading">Review</text><text x="344" y="198" font-size="16" class="heading">and test</text><text x="344" y="223" font-size="14" class="role">Human</text>
<rect x="492" y="112" width="136" height="126" rx="8" fill="#eef1e9" stroke="#c7ccc3" /><g transform="translate(504 122)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="27" height="29" rx="4" /><path d="M9 12l3 3 6-7M9 23l3 3 6-7M22 12h3M22 23h3" /></g><text x="504" y="177" font-size="16" class="heading">Integration</text><text x="504" y="198" font-size="16" class="heading">checks</text><text x="504" y="223" font-size="14" class="role">Automation</text>
<rect x="652" y="112" width="136" height="126" rx="8" fill="#f4e9de" stroke="#c7ccc3" /><g transform="translate(664 122)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="9" r="7" /><path d="M2 33v-4c0-13 28-13 28 0v4" /></g><text x="664" y="177" font-size="16" class="heading">Review</text><text x="664" y="198" font-size="16" class="heading">and merge</text><text x="664" y="223" font-size="14" class="role">Team</text>
<path d="M148 175H160" class="flow" />
<path d="M640 175H652" class="flow" />
<text x="652" y="98" font-size="14" class="role">All three passed</text>
<text x="176" y="257" font-size="15" class="role">Start another check or repair</text>
<path d="M400 266V292H80V238" class="rework rework-end" />
<text x="80" y="322" font-size="16" class="role" style="fill:#8d3925">When a repair starts, cancel checks still running on the old revision.</text>
<rect x="12" y="348" width="776" height="39" rx="7" fill="#faf8f3" stroke="#c7ccc3" stroke-dasharray="4 4" />
<text x="26" y="373" font-size="16" class="role">All three checks must pass the current revision. A human still approves.</text>
</svg>
