<svg xmlns="http://www.w3.org/2000/svg" width="360" height="728" viewBox="0 0 360 728" role="img" aria-labelledby="title desc">
<title id="title">The same checks can overlap</title>
<desc id="desc">A coding agent implements and tests. Independent agent review, human review and integration checks can overlap on the same revision. As results come in, the process may start or stop a check, wait, or repair. Starting a repair cancels checks in progress. The team can merge once all three have passed the current revision.</desc>
<defs><marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#535e57" /></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d3925" /></marker></defs>
<style>text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #252b2a; } .heading { font-weight:650; } .role { fill:#535e57; } .flow { fill:none; stroke:#535e57; stroke-width:1.8; marker-end:url(#forward); } .rework { fill:none; stroke:#8d3925; stroke-width:1.8; } .rework-end { marker-end:url(#return); }</style>
<text x="12" y="23" font-size="19" class="heading">Checks can overlap</text>
<rect x="46" y="122" width="312" height="360" rx="10" fill="#faf8f3" stroke="#24604f" stroke-width="1.5" />
<text x="62" y="147" font-size="19" class="heading">Three checks on one revision</text>
<text x="62" y="171" font-size="14" class="role">Start or stop checks as results come in</text>
<rect x="56" y="40" width="292" height="64" rx="8" fill="#eef1e9" stroke="#24604f" /><text x="76" y="65" font-size="19" class="heading">Implement and test</text><text x="76" y="89" font-size="16.5" class="role">Coding agent</text><g transform="translate(303 55)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="28" height="22" rx="5" /><path d="M16 8V2M0 16H2M30 16H33M10 24H22" /><circle cx="10" cy="16" r="1.4" fill="#252b2a" /><circle cx="22" cy="16" r="1.4" fill="#252b2a" /></g>
<path d="M66 216V380M66 216H76M66 298H76M66 380H76" fill="none" stroke="#24604f" stroke-width="1.4" />
<rect x="76" y="184" width="272" height="64" rx="8" fill="#eef1e9" stroke="#24604f" /><text x="96" y="209" font-size="19" class="heading">Review (and test)</text><text x="96" y="233" font-size="16.5" class="role">Another agent</text><g transform="translate(303 199)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="28" height="22" rx="5" /><path d="M16 8V2M0 16H2M30 16H33M10 24H22" /><circle cx="10" cy="16" r="1.4" fill="#252b2a" /><circle cx="22" cy="16" r="1.4" fill="#252b2a" /></g>
<rect x="76" y="266" width="272" height="64" rx="8" fill="#f4e9de" stroke="#c7ccc3" /><text x="96" y="291" font-size="19" class="heading">Review and test</text><text x="96" y="315" font-size="16.5" class="role">Human</text><g transform="translate(303 281)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="9" r="7" /><path d="M2 33v-4c0-13 28-13 28 0v4" /></g>
<rect x="76" y="348" width="272" height="64" rx="8" fill="#eef1e9" stroke="#c7ccc3" /><text x="96" y="373" font-size="19" class="heading">Integration checks</text><text x="96" y="397" font-size="16.5" class="role">Automation</text><g transform="translate(303 363)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="27" height="29" rx="4" /><path d="M9 12l3 3 6-7M9 23l3 3 6-7M22 12h3M22 23h3" /></g>
<rect x="56" y="520" width="292" height="64" rx="8" fill="#f4e9de" stroke="#c7ccc3" /><text x="76" y="545" font-size="19" class="heading">Review and merge</text><text x="76" y="569" font-size="16.5" class="role">Team</text><g transform="translate(303 535)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="9" r="7" /><path d="M2 33v-4c0-13 28-13 28 0v4" /></g>
<path d="M202 104V122" class="flow" />
<path d="M202 482V520" class="flow" />
<text x="220" y="498" font-size="14" class="role">All three passed</text><text x="220" y="515" font-size="12" style="fill:#24604f">End of measured time</text>
<text x="66" y="439" font-size="16" class="role">Start another check</text>
<text x="66" y="462" font-size="16" class="role">or repair.</text>
<path d="M46 302H22V72H56" class="rework rework-end" />
<text x="12" y="610" font-size="16" class="role" style="fill:#8d3925">When a repair starts, cancel checks</text>
<text x="12" y="632" font-size="16" class="role" style="fill:#8d3925">still running on the old revision.</text>
<rect x="12" y="652" width="336" height="56" rx="7" fill="#faf8f3" stroke="#c7ccc3" stroke-dasharray="4 4" />
<text x="24" y="675" font-size="16.5" class="heading">All three checks must pass</text>
<text x="24" y="696" font-size="16" class="role">A human still approves.</text>
</svg>
