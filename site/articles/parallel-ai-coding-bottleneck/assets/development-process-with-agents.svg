<svg xmlns="http://www.w3.org/2000/svg" width="800" height="304" viewBox="0 0 800 304" role="img" aria-labelledby="title desc">
<title id="title">Agents added to the development process</title>
<desc id="desc">A coding agent implements and tests, an independent agent reviews and may also test, and a human reviews and tests before automated integration checks and a team-owned merge. Failed checks return work to implementation. The team coordinates the work and owns approval.</desc>
<defs><marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#535e57" /></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d3925" /></marker></defs>
<style>text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #252b2a; } .heading { font-weight:650; } .role { fill:#535e57; } .flow { fill:none; stroke:#535e57; stroke-width:1.8; marker-end:url(#forward); } .rework { fill:none; stroke:#8d3925; stroke-width:1.8; } .rework-end { marker-end:url(#return); }</style>
<text x="12" y="24" font-size="20" class="heading">Agents added to the development process</text>
<path d="M12 46V40H628V46" fill="none" stroke="#24604f" stroke-width="1.4" /><text x="628" y="34" font-size="13" text-anchor="end" style="fill:#24604f">Measured time</text>
<rect x="12" y="48" width="136" height="126" rx="8" fill="#eef1e9" stroke="#24604f" />
<g transform="translate(24 58)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="28" height="22" rx="5" /><path d="M16 8V2M0 16H2M30 16H33M10 24H22" /><circle cx="10" cy="16" r="1.4" fill="#252b2a" /><circle cx="22" cy="16" r="1.4" fill="#252b2a" /></g>
<text x="24" y="113" font-size="16" class="heading">Implement</text>
<text x="24" y="134" font-size="16" class="heading">and test</text>
<text x="24" y="159" font-size="14" class="role">Coding agent</text>
<path d="M148 111H172" class="flow" />
<rect x="172" y="48" width="136" height="126" rx="8" fill="#eef1e9" stroke="#24604f" />
<g transform="translate(184 58)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="28" height="22" rx="5" /><path d="M16 8V2M0 16H2M30 16H33M10 24H22" /><circle cx="10" cy="16" r="1.4" fill="#252b2a" /><circle cx="22" cy="16" r="1.4" fill="#252b2a" /></g>
<text x="184" y="113" font-size="16" class="heading">Review</text>
<text x="184" y="134" font-size="16" class="heading">(and test)</text>
<text x="184" y="159" font-size="14" class="role">Another agent</text>
<path d="M308 111H332" class="flow" />
<rect x="332" y="48" width="136" height="126" rx="8" fill="#f4e9de" stroke="#c7ccc3" />
<g transform="translate(344 58)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="9" r="7" /><path d="M2 33v-4c0-13 28-13 28 0v4" /></g>
<text x="344" y="113" font-size="16" class="heading">Review</text>
<text x="344" y="134" font-size="16" class="heading">and test</text>
<text x="344" y="159" font-size="14" class="role">Human</text>
<path d="M468 111H492" class="flow" />
<rect x="492" y="48" width="136" height="126" rx="8" fill="#eef1e9" stroke="#c7ccc3" />
<g transform="translate(504 58)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="27" height="29" rx="4" /><path d="M9 12l3 3 6-7M9 23l3 3 6-7M22 12h3M22 23h3" /></g>
<text x="504" y="113" font-size="16" class="heading">Integration</text>
<text x="504" y="134" font-size="16" class="heading">checks</text>
<text x="504" y="159" font-size="14" class="role">Automation</text>
<path d="M628 111H652" class="flow" />
<rect x="652" y="48" width="136" height="126" rx="8" fill="#f4e9de" stroke="#c7ccc3" />
<g transform="translate(664 58)" fill="none" stroke="#252b2a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="9" r="7" /><path d="M2 33v-4c0-13 28-13 28 0v4" /></g>
<text x="664" y="113" font-size="16" class="heading">Review</text>
<text x="664" y="134" font-size="16" class="heading">and merge</text>
<text x="664" y="159" font-size="14" class="role">Team</text>
<path d="M560 174V206H80V174" class="rework rework-end" />
<path d="M240 174V206" class="rework" />
<circle cx="240" cy="206" r="2.5" fill="#8d3925" />
<path d="M400 174V206" class="rework" />
<circle cx="400" cy="206" r="2.5" fill="#8d3925" />
<text x="80" y="232" font-size="16" style="fill:#8d3925">Failed check → rework</text>
<rect x="12" y="253" width="776" height="39" rx="7" fill="#faf8f3" stroke="#c7ccc3" stroke-dasharray="4 4" />
<text x="26" y="278" font-size="16" class="role">The team coordinates the work and owns final approval.</text>
</svg>
