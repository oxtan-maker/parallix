<svg xmlns="http://www.w3.org/2000/svg" width="380" height="400" viewBox="0 0 380 400" role="img" aria-labelledby="title desc">
<title id="title">A repair introduces a duplicate property</title><desc id="desc">The same object has two admission properties. Jev cleared the repair. A follow-up review reproduced the deterministic TS1117 typecheck error; the ordinary local typecheck rejects the revision.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#535e57"/></marker></defs>
<text x="18" y="26" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="18" dy="0">Repair fixture · simplified</tspan></text>
<rect x="18" y="43" width="344" height="145" rx="3" fill="#faf8f3" stroke="#c7ccc3" stroke-width="1.5"/>
<text x="32" y="73" font-family="ui-monospace,monospace" font-size="16" font-weight="400" fill="#252b2a" text-anchor="start"><tspan x="32" dy="0">{</tspan><tspan x="32" dy="22.4">  admission: { /* added */ },</tspan><tspan x="32" dy="22.4">  admission: { /* existing */ }</tspan><tspan x="32" dy="22.4">}</tspan></text>
<path d="M32,133 H348" fill="none" stroke="#8d3925" stroke-width="1.5"/>
<path d="M190,188 V214" fill="none" stroke="#535e57" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="18" y="216" width="344" height="57" rx="3" fill="#eef1e9" stroke="#24604f" stroke-width="1.5"/>
<text x="190" y="251" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#24604f" text-anchor="middle"><tspan x="190" dy="0">Jev: preserves → clear</tspan></text>
<rect x="18" y="300" width="344" height="68" rx="3" fill="#faf8f3" stroke="#8d3925" stroke-width="1.5"/>
<text x="190" y="329" font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#8d3925" text-anchor="middle"><tspan x="190" dy="0">Follow-up review: TS1117</tspan><tspan x="190" dy="22.4">Local typecheck rejects the repair</tspan></text>
<text x="18" y="393" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#535e57" text-anchor="start"><tspan x="18" dy="0">Cost when caught: another repair/re-review round.</tspan></text>
</svg>
