<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
<title id="title">Both repairs can make the test pass</title><desc id="desc">Schematic examples, not measured repairs. Fixing a code or test regression preserves the intended check. Deleting or weakening a test or required assertion leaves intended behaviour unchecked. Both test runs report PASS; the reviewer judges whether the repair preserved what the test was meant to establish.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#535e57"/></marker></defs>
<text x="8" y="26" font-family="system-ui,sans-serif" font-size="21" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="8" dy="0">Both repairs can make the test pass</tspan></text>
<rect x="8" y="54" width="384" height="180" rx="3" fill="#faf8f3" stroke="#24604f" stroke-width="1.5"/>
<text x="23" y="83" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="23" dy="0">Fix the code or test regression</tspan></text>
<text x="23" y="113" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#535e57" text-anchor="start"><tspan x="23" dy="0">Repair the code or test logic.</tspan><tspan x="23" dy="22.4">Preserve the intended check.</tspan></text>
<rect x="23" y="153" width="354" height="32" rx="3" fill="#e5eee7" stroke="#24604f" stroke-width="1.5"/>
<text x="38" y="176" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#24604f" text-anchor="start"><tspan x="38" dy="0">Test run: PASS</tspan></text>
<text x="23" y="216" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#24604f" text-anchor="start"><tspan x="23" dy="0">Reviewer: check preserved</tspan></text>
<rect x="408" y="54" width="384" height="180" rx="3" fill="#faf8f3" stroke="#8d3925" stroke-width="1.5"/>
<text x="423" y="83" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="423" dy="0">Delete or weaken the test</tspan></text>
<text x="423" y="113" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#535e57" text-anchor="start"><tspan x="423" dy="0">Remove a test or assertion.</tspan><tspan x="423" dy="22.4">Leave its behaviour unchecked.</tspan></text>
<rect x="423" y="153" width="354" height="32" rx="3" fill="#e5eee7" stroke="#24604f" stroke-width="1.5"/>
<text x="438" y="176" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#24604f" text-anchor="start"><tspan x="438" dy="0">Test run: PASS</tspan></text>
<text x="423" y="216" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#8d3925" text-anchor="start"><tspan x="423" dy="0">Reviewer: check weakened</tspan></text>
<text x="8" y="280" font-family="system-ui,sans-serif" font-size="19" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="8" dy="0">Test run: does it pass? Review: does it still check what it should?</tspan></text>
</svg>
