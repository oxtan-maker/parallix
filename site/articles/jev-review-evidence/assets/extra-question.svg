<svg xmlns="http://www.w3.org/2000/svg" width="800" height="235" viewBox="0 0 800 235" role="img" aria-labelledby="title desc">
<title id="title">Correct clears · 35 historical rounds</title><desc id="desc">Common zero-based scale from zero to 20. Historical tuning evidence, not live quality validation.</desc>
