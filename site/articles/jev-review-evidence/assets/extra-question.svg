<text x="8" y="26" font-family="system-ui,sans-serif" font-size="21" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="8" dy="0">Correct clears · 35 historical rounds</tspan></text>
<text x="8" y="86" font-family="system-ui,sans-serif" font-size="19" font-weight="400" fill="#252b2a" text-anchor="start"><tspan x="8" dy="0">Obligations only</tspan></text>
<rect x="242" y="64" width="450.0" height="29" rx="3" fill="#24604f" stroke="none" stroke-width="0"/>
<text x="718" y="86" font-family="system-ui,sans-serif" font-size="22" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="718" dy="0">20</tspan></text>
<text x="8" y="151" font-family="system-ui,sans-serif" font-size="19" font-weight="400" fill="#252b2a" text-anchor="start"><tspan x="8" dy="0">+ New-defect question</tspan></text>
<rect x="242" y="129" width="180.0" height="29" rx="3" fill="#a3aba3" stroke="none" stroke-width="0"/>
<text x="718" y="151" font-family="system-ui,sans-serif" font-size="22" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="718" dy="0">8</tspan></text>
<path d="M242,191 H692" fill="none" stroke="#c7ccc3" stroke-width="1.5"/>
<text x="242" y="216" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#535e57" text-anchor="start"><tspan x="242" dy="0">0</tspan></text>
<text x="692" y="216" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#535e57" text-anchor="end"><tspan x="692" dy="0">20</tspan></text>
<text x="467.0" y="216" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#535e57" text-anchor="middle"><tspan x="467.0" dy="0">approved clears</tspan></text>
