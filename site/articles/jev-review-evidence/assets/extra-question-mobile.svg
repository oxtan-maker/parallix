<svg xmlns="http://www.w3.org/2000/svg" width="380" height="270" viewBox="0 0 380 270" role="img" aria-labelledby="title desc">
<title id="title">Correct clears · 35 historical rounds</title><desc id="desc">Common zero-based scale from zero to 20. Historical tuning evidence, not live quality validation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#535e57"/></marker></defs>
<text x="18" y="25" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="18" dy="0">Correct clears</tspan></text>
<text x="18" y="50" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#535e57" text-anchor="start"><tspan x="18" dy="0">35 historical rounds · tuning</tspan></text>
<text x="18" y="85" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#252b2a" text-anchor="start"><tspan x="18" dy="0">Obligations only</tspan></text>
<rect x="18" y="97" width="274.0" height="24" rx="3" fill="#24604f" stroke="none" stroke-width="0"/>
<text x="309" y="116" font-family="system-ui,sans-serif" font-size="20" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="309" dy="0">20</tspan></text>
<text x="18" y="167" font-family="system-ui,sans-serif" font-size="18" font-weight="400" fill="#252b2a" text-anchor="start"><tspan x="18" dy="0">+ New-defect question</tspan></text>
<rect x="18" y="179" width="109.6" height="24" rx="3" fill="#a3aba3" stroke="none" stroke-width="0"/>
<text x="309" y="198" font-family="system-ui,sans-serif" font-size="20" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="309" dy="0">8</tspan></text>
<path d="M18,231 H292" fill="none" stroke="#c7ccc3" stroke-width="1.5"/>
<text x="18" y="256" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#535e57" text-anchor="start"><tspan x="18" dy="0">0</tspan></text>
<text x="292" y="256" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#535e57" text-anchor="end"><tspan x="292" dy="0">20</tspan></text>
<text x="155.0" y="256" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#535e57" text-anchor="middle"><tspan x="155.0" dy="0">approved clears</tspan></text>
