<svg xmlns="http://www.w3.org/2000/svg" width="380" height="446" viewBox="0 0 380 446" role="img" aria-labelledby="title desc">
<title id="title">The review workflow</title><desc id="desc">Agent A implements with checkpoints. Agent B independently reviews using a different model. Human review precedes local integration gates. A dotted arrow marks the handoff to upstream CI integration gates, not an optional check. Findings and failed local gates share a return path for repair.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="#535e57"/></marker></defs>
<rect x="58" y="10" width="307" height="58" rx="8" fill="#eef1e9" stroke="#c9ccc3" stroke-width="1"/>
<g transform="translate(72 22)" fill="none" stroke="#252b2a" stroke-width="1.7"><rect x="2" y="8" width="28" height="22" rx="5"/><path d="M16 8V2M0 16H2M30 16H33M10 24H22"/><circle cx="10" cy="16" r="1.4" fill="#252b2a"/><circle cx="22" cy="16" r="1.4" fill="#252b2a"/></g>
<text x="117" y="45" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="117" dy="0">Implement</tspan></text>
<text x="235" y="34" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#59615c" text-anchor="start"><tspan x="235" dy="0">Agent A writes</tspan></text>
<g stroke="#9b3d25" stroke-width="1.5" fill="#eef1e9"><path d="M235 54H253" fill="none"/><circle cx="235" cy="54" r="2.5"/><circle cx="244" cy="54" r="2.5"/><circle cx="253" cy="54" r="2.5"/></g>
<text x="263" y="59" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#59615c" text-anchor="start"><tspan x="263" dy="0">Checkpoints</tspan></text>
<path d="M211,68 V86" fill="none" stroke="#535e57" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="58" y="88" width="307" height="58" rx="8" fill="#eef1e9" stroke="#c9ccc3" stroke-width="1"/>
<g transform="translate(72 100)" fill="none" stroke="#252b2a" stroke-width="1.7"><rect x="2" y="8" width="28" height="22" rx="5"/><path d="M16 8V2M0 16H2M30 16H33M10 24H22"/><circle cx="10" cy="16" r="1.4" fill="#252b2a"/><circle cx="22" cy="16" r="1.4" fill="#252b2a"/></g>
<text x="117" y="123" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="117" dy="0">Review</tspan></text>
<text x="224" y="112" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#59615c" text-anchor="start"><tspan x="224" dy="0">Agent B reviews</tspan></text>
<text x="224" y="137" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#59615c" text-anchor="start"><tspan x="224" dy="0">(different model)</tspan></text>
<path d="M211,146 V164" fill="none" stroke="#535e57" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M58,117 H22" fill="none" stroke="#535e57" stroke-width="1.5"/>
<rect x="58" y="166" width="307" height="58" rx="8" fill="#f4e9de" stroke="#c9ccc3" stroke-width="1"/>
<g transform="translate(72 178)" fill="none" stroke="#252b2a" stroke-width="1.7"><circle cx="16" cy="9" r="7"/><path d="M2 33v-4c0-13 28-13 28 0v4"/></g>
<text x="117" y="188" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="117" dy="0">Human review</tspan></text>
<text x="117" y="214" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#59615c" text-anchor="start"><tspan x="117" dy="0">Try the result</tspan></text>
<path d="M211,224 V242" fill="none" stroke="#535e57" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M58,195 H22" fill="none" stroke="#535e57" stroke-width="1.5"/>
<rect x="58" y="244" width="307" height="58" rx="8" fill="#eef1e9" stroke="#c9ccc3" stroke-width="1"/>
<text x="78" y="266" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="78" dy="0">Local integration</tspan></text>
<text x="78" y="292" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#59615c" text-anchor="start"><tspan x="78" dy="0">Repository gates</tspan></text>
<path d="M58,273 H22" fill="none" stroke="#535e57" stroke-width="1.5"/>
<path d="M22,273 V39 H56" fill="none" stroke="#535e57" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M211,302 V328" fill="none" stroke="#535e57" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="58" y="330" width="307" height="58" rx="8" fill="#eef1e9" stroke="#c9ccc3" stroke-width="1"/>
<text x="78" y="352" font-family="system-ui,sans-serif" font-size="18" font-weight="650" fill="#252b2a" text-anchor="start"><tspan x="78" dy="0">CI integration</tspan></text>
<text x="78" y="378" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#59615c" text-anchor="start"><tspan x="78" dy="0">Upstream gates</tspan></text>
<text x="14" y="418" font-family="system-ui,sans-serif" font-size="15" font-weight="400" fill="#535e57" text-anchor="start"><tspan x="14" dy="0">Findings or failed local gates → repair</tspan></text>
<text x="14" y="440" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#535e57" text-anchor="start"><tspan x="14" dy="0">Dotted arrow: handoff to upstream CI.</tspan></text>
</svg>
