<title id="title">Jev decisions by review type and projected monthly savings</title><desc id="desc">Jev clears 37 local integration repairs and 4 general re-reviews, leaving 73 for the general reviewer out of 114. Mechanical restorations are excluded. Monthly projections include classifier evidence preparation and calls for both review types; untimed preparation is estimated.</desc>
