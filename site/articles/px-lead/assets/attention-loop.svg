<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 776" role="img" aria-labelledby="title desc"><title id="title">From attention to action</title><desc id="desc">Re-read attention and liveness. Leave live work alone and integration to humans. Run eligible action, then if stuck obtain bounded judgment and admitted fresh recovery; manual blockers skip lifecycle dispatch. Wait or escalate when admission or budgets prevent continuation. Re-observe the board.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53645b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#252b2a}.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:#46564e}.arrow{fill:none;stroke:#53645b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fffdf8;stroke:#a5b1a6;stroke-width:1.5}.human{fill:#f6e9df;stroke:#a75b3e;stroke-width:1.5}.lead{fill:#e6efe7;stroke:#24604f;stroke-width:1.5}</style><rect width="100%" height="100%" rx="12" fill="#eef1e9"/><rect class="box" x="24" y="24" width="450" height="76" rx="8"/><text class="label" x="40" y="54">Read board attention</text><text class="sub" x="40" y="79">Rebuild from current authorities.</text><path class="arrow" d="M249 100 V130"/><rect class="box" x="24" y="130" width="450" height="96" rx="8"/><text class="label" x="40" y="160">Recheck liveness</text><text class="sub" x="40" y="185">Before dispatch; again inside the recovery claim.</text><rect class="lead" x="514" y="130" width="258" height="96" rx="8"/><text class="label" x="530" y="160">Live work?</text><text class="sub" x="530" y="185">Wait; leave work alone.</text><path class="arrow" d="M474 178 H514"/><path class="arrow" d="M249 226 V256"/><rect class="box" x="24" y="256" width="450" height="96" rx="8"/><text class="label" x="40" y="286">Run the supported board action</text><text class="sub" x="40" y="311">Run active/review, then observe before recovery.</text><rect class="human" x="514" y="256" width="258" height="96" rx="8"/><text class="label" x="530" y="286">Human boundary?</text><text class="sub" x="530" y="311">No automatic landing.</text><path class="arrow" d="M474 304 H514"/><path class="arrow" d="M249 352 V382"/><rect class="lead" x="24" y="382" width="450" height="118" rx="8"/><text class="label" x="40" y="412">Still stuck: bounded judgment</text><text class="sub" x="40" y="437">Manual blockers enter here without dispatch.</text><text class="sub" x="40" y="459">Continue requires fresh, admitted evidence.</text><rect class="human" x="514" y="382" width="258" height="118" rx="8"/><text class="label" x="530" y="412">Cannot continue?</text><text class="sub" x="530" y="437">Wait or escalate with</text><text class="sub" x="530" y="459">the missing evidence or</text><text class="sub" x="530" y="481">operator decision.</text><path class="arrow" d="M474 440 H514"/><path class="arrow" d="M249 500 V530"/><rect class="lead" x="24" y="530" width="450" height="96" rx="8"/><text class="label" x="40" y="560">Fresh recovery in mission worktree</text><text class="sub" x="40" y="585">Finite attempts; no inherited failed session.</text><rect class="human" x="514" y="530" width="258" height="96" rx="8"/><text class="label" x="530" y="560">Budget exhausted?</text><text class="sub" x="530" y="585">Escalate with evidence.</text><path class="arrow" d="M474 578 H514"/><path class="arrow" d="M249 626 V656"/><rect class="box" x="24" y="656" width="748" height="96" rx="8"/><text class="label" x="40" y="686">Observe the board again</text><text class="sub" x="40" y="711">Agent exit is not proof. Live work is watched; cleared attention plus idle work clears the item.</text></svg>