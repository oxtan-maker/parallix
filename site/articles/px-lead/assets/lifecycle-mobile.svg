<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 790" role="img" aria-labelledby="title desc"><title id="title">Lead in the mission lifecycle</title><desc id="desc">Operator activates; implementer works; agent reviewer decides; human reviews and integrates. Lead supervises attention in active, review and integration but never integrates. Command-local repair stays within commands.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53645b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#252b2a}.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:#46564e}.arrow{fill:none;stroke:#53645b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fffdf8;stroke:#a5b1a6;stroke-width:1.5}.human{fill:#f6e9df;stroke:#a75b3e;stroke-width:1.5}.lead{fill:#e6efe7;stroke:#24604f;stroke-width:1.5}</style><rect width="100%" height="100%" rx="12" fill="#eef1e9"/><rect class="human" x="16" y="16" width="328" height="88" rx="8"/><text class="label" x="32" y="46">Operator activates</text><text class="sub" x="32" y="71">Refined work waits for you.</text><path class="arrow" d="M180 104 V134"/><rect class="box" x="16" y="136" width="328" height="88" rx="8"/><text class="label" x="32" y="166">Implement</text><text class="sub" x="32" y="191">Checkpoints and checks</text><path class="arrow" d="M180 224 V254"/><rect class="box" x="16" y="256" width="328" height="88" rx="8"/><text class="label" x="32" y="286">Agent review</text><text class="sub" x="32" y="311">Reviewer owns the verdict.</text><path class="arrow" d="M180 344 V374"/><rect class="human" x="16" y="376" width="328" height="88" rx="8"/><text class="label" x="32" y="406">Human integration</text><text class="sub" x="32" y="431">Human review, checks, landing</text><rect class="lead" x="16" y="514" width="328" height="106" rx="8"/><text class="label" x="32" y="544">px lead: fleet supervision</text><text class="sub" x="32" y="569">Watches attention in these lanes.</text><text class="sub" x="32" y="591">Resumes eligible active/review work.</text><text class="sub" x="32" y="613">Never integrates.</text><rect class="box" x="16" y="678" width="328" height="92" rx="8"/><text class="label" x="32" y="708">Command-local repair</text><text class="sub" x="32" y="733">Known failures inside a command.</text><text class="sub" x="32" y="755">Lead watches between commands.</text></svg>