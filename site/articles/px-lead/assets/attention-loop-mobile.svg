<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 828" role="img" aria-labelledby="title desc"><title id="title">Attention, action and recovery</title><desc id="desc">Current attention, liveness check, supported action, judgment, fresh recovery, and board observation. Live workers wait; human landing remains human. Manual blockers skip dispatch. Missing admission or exhausted budgets lead to escalation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53645b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#252b2a}.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:#46564e}.arrow{fill:none;stroke:#53645b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fffdf8;stroke:#a5b1a6;stroke-width:1.5}.human{fill:#f6e9df;stroke:#a75b3e;stroke-width:1.5}.lead{fill:#e6efe7;stroke:#24604f;stroke-width:1.5}</style><rect width="100%" height="100%" rx="12" fill="#eef1e9"/><rect class="box" x="16" y="16" width="328" height="84" rx="8"/><text class="label" x="32" y="46">Read board attention</text><text class="sub" x="32" y="71">Use current authorities.</text><path class="arrow" d="M180 100 V130"/><rect class="box" x="16" y="132" width="328" height="106" rx="8"/><text class="label" x="32" y="162">Recheck liveness</text><text class="sub" x="32" y="187">Live work? Wait.</text><text class="sub" x="32" y="209">Do not dispatch onto a worker.</text><path class="arrow" d="M180 238 V268"/><rect class="box" x="16" y="270" width="328" height="106" rx="8"/><text class="label" x="32" y="300">Supported board action</text><text class="sub" x="32" y="325">Active or review owner.</text><text class="sub" x="32" y="347">Human landing? Leave it to you.</text><path class="arrow" d="M180 376 V406"/><rect class="lead" x="16" y="408" width="328" height="106" rx="8"/><text class="label" x="32" y="438">Still stuck: judgment</text><text class="sub" x="32" y="463">Manual blockers skip dispatch.</text><text class="sub" x="32" y="485">Wait or escalate if not admitted.</text><path class="arrow" d="M180 514 V544"/><rect class="lead" x="16" y="546" width="328" height="106" rx="8"/><text class="label" x="32" y="576">Fresh recovery</text><text class="sub" x="32" y="601">Mission worktree; finite attempts.</text><text class="sub" x="32" y="623">No budget? Escalate with evidence.</text><path class="arrow" d="M180 652 V682"/><rect class="box" x="16" y="684" width="328" height="128" rx="8"/><text class="label" x="32" y="714">Observe board again</text><text class="sub" x="32" y="739">Exit status alone proves nothing.</text><text class="sub" x="32" y="761">Live work: watch. Idle and off</text><text class="sub" x="32" y="783">the queue: attention cleared.</text></svg>