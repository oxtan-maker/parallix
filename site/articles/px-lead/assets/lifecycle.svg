<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 532" role="img" aria-labelledby="title desc"><title id="title">Where lead fits</title><desc id="desc">Operator activation precedes implementation, agent review and human integration. Lead supervises active, review and integration attention; it resumes eligible implementation or review, never landing. Command-local repair remains inside its command.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#53645b"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#252b2a}.label{font-size:18px;font-weight:650}.sub{font-size:15px;fill:#46564e}.arrow{fill:none;stroke:#53645b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fffdf8;stroke:#a5b1a6;stroke-width:1.5}.human{fill:#f6e9df;stroke:#a75b3e;stroke-width:1.5}.lead{fill:#e6efe7;stroke:#24604f;stroke-width:1.5}</style><rect width="100%" height="100%" rx="12" fill="#eef1e9"/><rect class="human" x="24" y="24" width="748" height="84" rx="8"/><text class="label" x="40" y="54">Operator activates the mission</text><text class="sub" x="40" y="79">Refined work waits for this decision.</text><path class="arrow" d="M134 108 V140"/><rect class="box" x="24" y="140" width="222" height="90" rx="8"/><text class="label" x="40" y="170">Implement</text><text class="sub" x="40" y="195">Checkpoints and checks</text><rect class="box" x="286" y="140" width="222" height="90" rx="8"/><text class="label" x="302" y="170">Agent review</text><text class="sub" x="302" y="195">Reviewer owns verdict</text><rect class="human" x="548" y="140" width="224" height="90" rx="8"/><text class="label" x="564" y="170">Human integration</text><text class="sub" x="564" y="195">Review, checks, landing</text><path class="arrow" d="M246 185 H286"/><path class="arrow" d="M508 185 H548"/><rect class="lead" x="24" y="286" width="748" height="106" rx="8"/><text class="label" x="40" y="316">px lead watches the board’s attention queue</text><text class="sub" x="40" y="341">Active · review · integration lanes; act only when current evidence permits.</text><text class="sub" x="40" y="363">A stopped workflow can re-enter its existing command owner.</text><path class="arrow" d="M134 286 V240"/><path class="arrow" d="M397 286 V240"/><text class="sub" x="150" y="265">Resume eligible work</text><text class="sub" x="550" y="265">Landing stays with you</text><rect class="box" x="24" y="426" width="748" height="82" rx="8"/><text class="label" x="40" y="456">Repair within a running command</text><text class="sub" x="40" y="481">The rebound kernel handles known local failures; lead watches between commands.</text></svg>