<svg xmlns="http://www.w3.org/2000/svg" width="780" height="557" viewBox="0 0 780 557" role="img" aria-labelledby="title desc">
<title id="title">Between checkpoints: Cost and recorded time</title>
<desc id="desc">Cost and recorded time across 20 matched tasks, with the highest total for each measure set to 100%. Cost: Continue 62.9%, Compact 63.7%, Fresh 100.0%. Time: Compact 57.7%, Continue 62.7%, Fresh 100.0%. Bars sort ascending within each measure. Measures stop before independent review.</desc>
<rect width="780" height="557" fill="#faf8f3"/>
<style>text{font-family:"DejaVu Sans",Arial,sans-serif;fill:#252b2a}.muted{fill:#535e57}.rule{stroke:#c7ccc3;stroke-width:1}</style>
<text x="20" y="32" font-size="18.5" text-anchor="start" font-weight="700">Between checkpoints</text>
<text x="20" y="59" font-size="12.5" text-anchor="start" class="muted">20 matched tasks · Highest cost and longest time = 100%</text>
<g id="api_cost-panel">
<text x="118" y="105" font-size="15" text-anchor="start" font-weight="700">Cost</text>
<line class="rule" x1="118.0" y1="116" x2="118.0" y2="237"/>
<text x="118.0" y="254" font-size="12" text-anchor="middle" class="muted">0%</text>
<line class="rule" x1="248.0" y1="116" x2="248.0" y2="237"/>
<text x="248.0" y="254" font-size="12" text-anchor="middle" class="muted">25%</text>
<line class="rule" x1="378.0" y1="116" x2="378.0" y2="237"/>
<text x="378.0" y="254" font-size="12" text-anchor="middle" class="muted">50%</text>
<line class="rule" x1="508.0" y1="116" x2="508.0" y2="237"/>
<text x="508.0" y="254" font-size="12" text-anchor="middle" class="muted">75%</text>
<line class="rule" x1="638.0" y1="116" x2="638.0" y2="237"/>
<text x="638.0" y="254" font-size="12" text-anchor="middle" class="muted">100%</text>
<g id="api_cost-complete_matched-Continue-bar"><rect x="118" y="121" width="327.013454779" height="26" fill="#919e94"/></g>
<text x="106" y="138.5" font-size="14" text-anchor="end" class="muted">Continue</text>
<text x="453.01345477908194" y="138.5" font-size="14" text-anchor="start" font-weight="700">62.9%</text>
<g id="api_cost-complete_matched-Compact-bar"><rect x="118" y="163" width="331.074415755" height="26" fill="#b3b8aa"/></g>
<text x="106" y="180.5" font-size="14" text-anchor="end" class="muted">Compact</text>
<text x="457.0744157550921" y="180.5" font-size="14" text-anchor="start" font-weight="700">63.7%</text>
<g id="api_cost-complete_matched-Fresh-bar"><rect x="118" y="205" width="520.000000000" height="26" fill="#24604f"/></g>
<text x="106" y="222.5" font-size="14" text-anchor="end" class="muted">Fresh</text>
<text x="646.0" y="222.5" font-size="14" text-anchor="start" font-weight="700">100%</text>
<text x="378.0" y="280" font-size="12" text-anchor="middle" class="muted">Lower is better</text>
</g>
<g id="time-panel">
<text x="118" y="335" font-size="15" text-anchor="start" font-weight="700">Recorded time</text>
<line class="rule" x1="118.0" y1="346" x2="118.0" y2="467"/>
<text x="118.0" y="484" font-size="12" text-anchor="middle" class="muted">0%</text>
<line class="rule" x1="248.0" y1="346" x2="248.0" y2="467"/>
<text x="248.0" y="484" font-size="12" text-anchor="middle" class="muted">25%</text>
<line class="rule" x1="378.0" y1="346" x2="378.0" y2="467"/>
<text x="378.0" y="484" font-size="12" text-anchor="middle" class="muted">50%</text>
<line class="rule" x1="508.0" y1="346" x2="508.0" y2="467"/>
<text x="508.0" y="484" font-size="12" text-anchor="middle" class="muted">75%</text>
<line class="rule" x1="638.0" y1="346" x2="638.0" y2="467"/>
<text x="638.0" y="484" font-size="12" text-anchor="middle" class="muted">100%</text>
<g id="time-complete_matched-Compact-bar"><rect x="118" y="351" width="300.096594722" height="26" fill="#b3b8aa"/></g>
<text x="106" y="368.5" font-size="14" text-anchor="end" class="muted">Compact</text>
<text x="426.09659472200923" y="368.5" font-size="14" text-anchor="start" font-weight="700">57.7%</text>
<g id="time-complete_matched-Continue-bar"><rect x="118" y="393" width="326.147336446" height="26" fill="#919e94"/></g>
<text x="106" y="410.5" font-size="14" text-anchor="end" class="muted">Continue</text>
<text x="452.1473364458774" y="410.5" font-size="14" text-anchor="start" font-weight="700">62.7%</text>
<g id="time-complete_matched-Fresh-bar"><rect x="118" y="435" width="520.000000000" height="26" fill="#24604f"/></g>
<text x="106" y="452.5" font-size="14" text-anchor="end" class="muted">Fresh</text>
<text x="646.0" y="452.5" font-size="14" text-anchor="start" font-weight="700">100%</text>
<text x="378.0" y="510" font-size="12" text-anchor="middle" class="muted">Lower is better</text>
</g>
<text x="20" y="540" font-size="11.5" text-anchor="start" class="muted">Both measures stop before independent review.</text>
</svg>
